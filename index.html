<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>threejs-extras · light-slots</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        color: #eee;
        font: 14px/1.4 system-ui, sans-serif;
      }
      canvas {
        display: block;
      }
      #panel {
        position: fixed;
        top: 16px;
        left: 16px;
        width: 300px;
        padding: 14px 16px;
        border-radius: 10px;
        background: rgb(20 20 22 / 0.88);
        box-shadow: 0 4px 24px rgb(0 0 0 / 0.4);
      }
      #panel h1 {
        margin: 0 0 4px;
        font-size: 15px;
      }
      #panel p {
        margin: 0 0 12px;
        color: #aaa;
        font-size: 13px;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }
      button {
        flex: 1;
        padding: 7px 0;
        border: 1px solid #444;
        border-radius: 6px;
        background: #222;
        color: #eee;
        cursor: pointer;
      }
      button:hover {
        background: #2c2c30;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        cursor: pointer;
      }
      dl {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 4px 12px;
        margin: 0;
        font-variant-numeric: tabular-nums;
      }
      dt {
        color: #aaa;
      }
      dd {
        margin: 0;
        text-align: right;
      }
      #freeze.bad {
        color: #ff7a6b;
      }
      #freeze.good {
        color: #7be08f;
      }
    </style>
  </head>
  <body>
    <div id="panel">
      <h1>light-slots</h1>
      <p>Add or remove a lamp and watch the frame it lands on. Without slots every lit shader compiles again.</p>
      <label><input id="slots" type="checkbox" /> Use LightSlots (reloads the page)</label>
      <div class="row">
        <button id="add">Add lamp</button>
        <button id="remove">Remove lamp</button>
      </div>
      <dl>
        <dt>Lamps</dt>
        <dd id="lamps">0</dd>
        <dt>Area lights three counts</dt>
        <dd id="counted">0</dd>
        <dt>Last change, frame time</dt>
        <dd id="freeze">-</dd>
        <dt>Shaders compiled by it</dt>
        <dd id="compiled">-</dd>
        <dt>Shader programs held</dt>
        <dd id="programs">0</dd>
      </dl>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

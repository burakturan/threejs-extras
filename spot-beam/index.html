<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>threejs-extras · spot-beam</title>
  </head>
  <body>
    <div id="panel">
      <h1>spot-beam</h1>
      <p>Switch to Plain cone and look where each beam meets the wall and the floor.</p>
      <div class="modes">
        <button data-mode="none">No beam</button>
        <button data-mode="cone">Plain cone</button>
        <button data-mode="beam">SpotBeam</button>
      </div>
      <div class="range"><span>Steps</span><input id="steps" type="range" min="4" max="64" step="4" value="24" /><output id="stepsOut">24</output></div>
      <div class="range"><span>Strength</span><input id="strength" type="range" min="0.05" max="1" step="0.05" value="0.35" /><output id="strengthOut">0.35</output></div>
      <dl>
        <dt>GPU time per frame</dt>
        <dd id="cost">-</dd>
      </dl>
    </div>
    <script type="module" src="/src/spot-beam.ts"></script>
  </body>
</html>
